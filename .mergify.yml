shared:
  ci_checks: &ci_checks
    - check-success = build
    - check-success = test
    - check-success = lint

merge_protections_settings:
  auto_merge_conditions:
    - -draft
    - or:
        - author != riya-amemiya
        - label = approve

merge_protections:
  - name: Main
    if:
      - base = main
    success_conditions:
      - and: *ci_checks
  - name: Maintainer review
    if:
      - author != riya-amemiya
    success_conditions:
      - approved-reviews-by = riya-amemiya

queue_rules:
  - name: default
    merge_method: squash
    queue_conditions:
      - and: *ci_checks
    merge_conditions:
      - and: *ci_checks
