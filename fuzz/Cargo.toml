test = false
doc = false
bench = false

[[bin]]
name = "hexdump_reverse"
path = "fuzz_targets/hexdump_reverse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "padding"
path = "fuzz_targets/padding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hashid_identify"
