[package]
edition = "2024"
name = "happy-cracking"
version = "0.12.0"
default-run = "happy-cracking"
autobins = false
description = "A fast, comprehensive CTF toolkit for cryptographic encoding/decoding, classic ciphers, hash operations, and analysis tools"
license = "MIT"
repository = "https://github.com/riya-amemiya/happy-cracking"
keywords = ["ctf", "cryptography", "cipher", "encoding", "security"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "happy-cracking"
path = "src/main.rs"

[[bin]]
name = "hgrep"
path = "src/bin/hgrep.rs"

[[bin]]
name = "hg"
path = "src/bin/hg.rs"

[[bin]]
name = "hfind"
path = "src/bin/hfind.rs"

[[bin]]
name = "hfd"
path = "src/bin/hfd.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
cipher = { version = "0.5.2", features = ["block-padding"] }
clap = { version = "4.6.6", features = ["derive"] }
des = "0.9.0"
hex = "0.4.3"
md-5 = "0.11.0"
md4 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
memchr = "2.8.3"
memmap2 = "0.9.11"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
regex = "1.13.1"
umt_rust = "0.7.0"
urlencoding = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rayon = "1.12.0"
zip = { version = "8.6.0", default-features = false, features = [
    "aes-crypto",
    "deflate",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
