[workspace]
members = ["crates/hc-internal", "crates/hfd", "crates/hrg"]

[workspace.package]
edition = "2024"
version = "1.3.0"
license = "MIT"
repository = "https://github.com/riya-amemiya/happy-cracking"

[workspace.dependencies]
hc-internal = { path = "crates/hc-internal", version = "=1.3.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-normalization = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"

[package]
edition.workspace = true
name = "happy-cracking"
version.workspace = true
default-run = "happy-cracking"
autobins = false
description = "A fast, comprehensive CTF toolkit for cryptographic encoding/decoding, classic ciphers, hash operations, and analysis tools"
license.workspace = true
repository.workspace = true
keywords = ["ctf", "cryptography", "cipher", "encoding", "security"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "happy-cracking"
path = "src/main.rs"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
cipher = { version = "0.5.2", features = ["block-padding"] }
clap = { version = "4.6.7", features = ["derive"] }
des = "0.9.0"
hex = "0.4.3"
md-5 = "0.11.0"
md4 = "0.11.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
umt_rust = "0.8.0"
urlencoding = "2.1.3"
hdrhistogram = { version = "7.6.0", default-features = false }
httparse = "1.10.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0.11"
socket2 = { version = "0.6.5", features = ["all"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rayon = "1.12.0"
zip = { version = "9.1.3", default-features = false, features = [
    "aes-crypto",
    "deflate",
] }
rand = "0.10.3"

[profile.release]
lto = "fat"
codegen-units = 1

[lints]
workspace = true
