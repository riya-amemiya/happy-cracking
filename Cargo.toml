[package]
edition = "2024"
name = "happy-cracking"
version = "0.4.0"
description = "A fast, comprehensive CTF toolkit for cryptographic encoding/decoding, classic ciphers, hash operations, and analysis tools"
license = "MIT"
repository = "https://github.com/riya-amemiya/happy-cracking"
keywords = ["ctf", "cryptography", "cipher", "encoding", "security"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes = "0.8.4"
anyhow = "1.0.102"
base64 = "0.22.1"
cipher = { version = "0.5.0", features = ["block-padding"] }
clap = {version = "4.5.60", features = ["derive"]}
des = "0.8.1"
hex = "0.4.3"
md-5 = "0.10.6"
md4 = "0.10.2"
sha1 = "0.10.6"
sha2 = "0.10.9"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
umt_rust = "0.6.0"
urlencoding = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rayon = "1.12.0"
zip = { version = "2.4.2", default-features = false, features = ["aes-crypto", "deflate"] }
