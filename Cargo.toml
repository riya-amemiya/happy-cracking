[package]
edition = "2024"
name = "happy-cracking"
version = "0.8.0"
default-run = "happy-cracking"
autobins = false
description = "A fast, comprehensive CTF toolkit for cryptographic encoding/decoding, classic ciphers, hash operations, and analysis tools"
license = "MIT"
repository = "https://github.com/riya-amemiya/happy-cracking"
keywords = ["ctf", "cryptography", "cipher", "encoding", "security"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "happy-cracking"
path = "src/main.rs"

[[bin]]
name = "hgrep"
path = "src/bin/hgrep/main.rs"

[[bin]]
name = "hg"
path = "src/bin/hgrep/main.rs"

[[bin]]
name = "hfind"
path = "src/bin/hfind/main.rs"

[[bin]]
name = "hfd"
path = "src/bin/hfind/main.rs"

[dependencies]
aes = "0.9.2"
anyhow = "1.0.104"
base64 = "0.23.0"
cipher = { version = "0.5.2", features = ["block-padding"] }
clap = {version = "4.6.4", features = ["derive"]}
des = "0.9.0"
hex = "0.4.3"
md-5 = "0.11.0"
md4 = "0.11.0"
memchr = "2.8.3"
regex = "1.12.3"
sha1 = "0.11.0"
sha2 = "0.11.0"
num-bigint = "0.5.1"
num-integer = "0.1.46"
num-traits = "0.2.19"
umt_rust = "0.6.0"
urlencoding = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rayon = "1.12.0"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }
libc = "0.2.189"
