[package]
edition = "2024"
name = "happy-cracking"
version = "0.1.0"
description = "A fast, comprehensive CTF toolkit for cryptographic encoding/decoding, classic ciphers, hash operations, and analysis tools"
license = "MIT"
repository = "https://github.com/riya-amemiya/happy-cracking"
keywords = ["ctf", "cryptography", "cipher", "encoding", "security"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes = "0.8.4"
anyhow = "1.0.101"
base64 = "0.22.1"
bs58 = "0.5.1"
cipher = { version = "0.5.0", features = ["block-padding"] }
clap = {version = "4.5.58", features = ["derive"]}
data-encoding = "2.10.0"
des = "0.8.1"
hex = "0.4.3"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.9"
num-bigint = "0.4.6"
num-integer = "0.1.46"
num-traits = "0.2.19"
urlencoding = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
