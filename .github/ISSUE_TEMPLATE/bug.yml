name: Bug report
description: Report incorrect output, a crash, or a CLI regression
labels: ["bug"]
body:
  - type: checkboxes
    id: existing
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues
          required: true
  - type: input
    id: version
    attributes:
      label: happy-cracking version
      placeholder: "0.17.0"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The subcommand or companion binary, for example `base64 decode` or `hgrep`
      placeholder: base64 decode
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The command and input that show the problem
      render: bash
    validations:
      required: true
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/riya-amemiya/happy-cracking/blob/main/CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
