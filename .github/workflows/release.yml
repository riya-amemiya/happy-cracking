# Publish happy-cracking to crates.io via Trusted Publishing (OIDC).
#
# After this workflow is on the default branch, add a Trusted Publisher at:
#   https://crates.io/crates/happy-cracking/settings
#
# Required crates.io fields (must match this file):
#   Repository owner: riya-amemiya
#   Repository name:  happy-cracking
#   Workflow filename: release.yml
#   Environment name:  release
#
# Create the matching GitHub Environment (Settings → Environments → release).
# Optional: add required reviewers or limit it to tags.
#
# Docs: https://crates.io/docs/trusted-publishing
name: Publish to crates.io

on:
  push:
    tags:
      # Existing releases use unprefixed semver tags (0.12.0, not v0.12.0).
      - "[0-9].*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run cargo publish --dry-run without uploading
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: github.repository == 'riya-amemiya/happy-cracking'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate_version="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "$tag" != "$crate_version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version '${crate_version}'"
            exit 1
          fi

      - name: Authenticate with crates.io
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          extra=()
          if [ "${DRY_RUN}" = "true" ]; then
            extra+=(--dry-run)
          fi
          cargo publish --locked "${extra[@]}"
